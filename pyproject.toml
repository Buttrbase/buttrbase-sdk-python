[project]
name = "buttrbase"
version = "0.4.0"
description = "Python client for the ButtrBase API"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://buttrbase.com"
Repository = "https://github.com/S7-Works/buttrbase-sdk-python"
Changelog = "https://github.com/S7-Works/buttrbase-sdk-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
